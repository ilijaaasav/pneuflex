[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Fajlovi funkcija (baza znanja, pravila) ne smeju biti javno dostupni
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
